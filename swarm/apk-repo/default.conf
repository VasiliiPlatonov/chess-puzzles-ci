# Хранилище APK-артефактов: чтение — через Traefik, запись — только из сети ci_internal
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 200m;

    location /apk/ {                    # каталог артефактов для тестировщиков
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
        limit_except GET HEAD { deny all; }
    }

    location /upload/ {                 # приём APK от Jenkins (WebDAV PUT)
        alias /usr/share/nginx/html/apk/;
        dav_methods PUT;
        create_full_put_path on;
        dav_access user:rw group:r all:r;
        limit_except PUT { deny all; }
    }
}
