# Стек «ci»: CI/CD-платформа мобильного приложения в кластере Docker Swarm
# Развёртывание: ./deploy.sh  (docker stack deploy -c ci-stack.yml ci)
version: "3.8"

services:
  traefik:                                   # точка входа, обратный прокси
    image: traefik:v3.1
    command:
      - --providers.swarm.endpoint=unix:///var/run/docker.sock
      - --providers.swarm.exposedByDefault=false
      - --providers.swarm.network=ci_public
      - --entrypoints.web.address=:80
      - --api.dashboard=true
    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [public]
    deploy:
      placement:
        constraints: [node.role == manager]
      labels:
        - traefik.enable=true
        - traefik.http.routers.dashboard.rule=Host(`traefik.ci.local`)
        - traefik.http.routers.dashboard.service=api@internal
        - traefik.http.services.noop.loadbalancer.server.port=9999

  jenkins:                                   # контроллер CI/CD со сборочным инструментарием
    image: 127.0.0.1:5000/chess-puzzles-jenkins:${JENKINS_TAG:-2.568.3}
    environment:
      JENKINS_ADMIN_ID: admin
      CASC_JENKINS_CONFIG: /var/jenkins_conf/jenkins.yaml
      JAVA_OPTS: "-Djenkins.install.runSetupWizard=false -Xmx2g"
    configs:
      - source: jenkins_casc
        target: /var/jenkins_conf/jenkins.yaml
    secrets:
      - jenkins_admin_password
      - telegram_bot_token
      - telegram_chat_id
    volumes:
      - jenkins_home:/var/jenkins_home
    networks: [public, internal]
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/login > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
    deploy:
      replicas: 1
      placement:
        constraints: [node.labels.ci.jenkins == true]
      resources:
        limits: {cpus: "3.0", memory: 6G}
        reservations: {memory: 3G}
      restart_policy: {condition: on-failure, delay: 10s, max_attempts: 3}
      update_config: {parallelism: 1, order: stop-first, failure_action: rollback, monitor: 240s}
      rollback_config: {parallelism: 1, order: stop-first}
      labels:
        - traefik.enable=true
        - traefik.http.routers.jenkins.rule=Host(`jenkins.ci.local`)
        - traefik.http.routers.jenkins.entrypoints=web
        - traefik.http.services.jenkins.loadbalancer.server.port=8080

  apk-repo:                                  # хранилище и раздача APK-артефактов
    image: nginx:1.27-alpine
    command: ["/bin/sh", "-c", "chown -R nginx:nginx /usr/share/nginx/html/apk && exec nginx -g 'daemon off;'"]
    configs:
      - source: apk_nginx_conf
        target: /etc/nginx/conf.d/default.conf
    volumes:
      - apk_data:/usr/share/nginx/html/apk
    networks: [public, internal]
    deploy:
      replicas: 1
      placement:
        constraints: [node.labels.ci.storage == true]
      labels:
        - traefik.enable=true
        - traefik.http.routers.apk.rule=Host(`apk.ci.local`) && PathPrefix(`/apk`)
        - traefik.http.routers.apk.entrypoints=web
        - traefik.http.services.apk.loadbalancer.server.port=80

  agent:                                     # агент Portainer на каждом узле
    image: portainer/agent:lts
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
    networks: [internal]
    deploy:
      mode: global
      placement:
        constraints: [node.platform.os == linux]

  portainer:                                 # веб-интерфейс управления кластером
    image: portainer/portainer-ce:lts
    command: -H tcp://tasks.agent:9001 --tlsskipverify
    volumes:
      - portainer_data:/data
    networks: [public, internal]
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]
      labels:
        - traefik.enable=true
        - traefik.http.routers.portainer.rule=Host(`portainer.ci.local`)
        - traefik.http.routers.portainer.entrypoints=web
        - traefik.http.services.portainer.loadbalancer.server.port=9000

networks:
  public:
    name: ci_public
    driver: overlay
    attachable: true
  internal:
    name: ci_internal
    driver: overlay
    internal: true

volumes:
  jenkins_home:
  apk_data:
  portainer_data:

configs:
  jenkins_casc:
    name: jenkins_casc_${CASC_VERSION:-1}
    file: ./casc/jenkins.yaml
  apk_nginx_conf:
    name: apk_nginx_conf_${NGINX_CONF_VERSION:-1}
    file: ./apk-repo/default.conf

secrets:
  jenkins_admin_password: {external: true}
  telegram_bot_token: {external: true}
  telegram_chat_id: {external: true}
